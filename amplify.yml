version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Bake server-side env into the build.
        #
        # Amplify app-level variables are reliably present at BUILD time; what
        # reaches the SSR compute runtime is not. /api/revalidate read
        # process.env.REVALIDATE_SECRET at runtime, got undefined, and failed
        # closed with a 503 even though the variable was set on the app.
        #
        # Writing it into .env.production means Next resolves it during the
        # build, which is the part that is dependable. NOT prefixed
        # NEXT_PUBLIC_, so it stays server-only and is never shipped to a
        # browser bundle.
        - echo "REVALIDATE_SECRET=$REVALIDATE_SECRET" >> .env.production
    build:
      commands:
        - npm run build
        # ⚠️ THE GUARD WAS NOT MISSING. check-og.mjs caught /payments shipping
        # with no og:image, correctly, on the very commit that introduced it
        # (run 40123758891, 2026-10-24). It changed nothing, for two reasons,
        # and the second is the one this block fixes:
        #
        #   1. CI had been RED since 2026-10-16 on an unrelated infrastructure
        #      step, so a new true failure looked exactly like the standing one.
        #      An alarm that always fires gets ignored — the morrell-uptime
        #      lesson, in its most expensive form.
        #   2. AMPLIFY BUILDS main INDEPENDENTLY OF GITHUB ACTIONS. A red CI has
        #      never blocked a deploy here. So the page went live bare while the
        #      check that would have stopped it was failing in another system.
        #
        # Running them here puts the check on the path that actually publishes.
        # After the build, because check:og reads the prerendered HTML a crawler
        # receives, not the source that produced it.
        - npm run check:og
        - npm run check:images
        # ⚠️ check:mobile is deliberately NOT here. It drives a headless browser
        # against a RUNNING server on :3999, so in a build phase with nothing
        # listening it fails every time — and a guard that always fails is worse
        # than no guard: it trains you to ignore the build, which is exactly how
        # the social-card failure stayed invisible for eight days. It belongs
        # behind `npm start`, run locally or in a CI job that boots the server.
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      # Webpack's cache only — NOT all of .next/cache.
      #
      # .next/cache also holds Next's fetch Data Cache, and persisting that
      # across builds means a rebuild restores STALE API responses and
      # re-renders old content. The symptom is not a build failure: the build
      # goes green and the site keeps serving the previous data, so a CMS change
      # looks like it simply never published and no amount of rebuilding fixes
      # it. Cover-image updates sat invisible through two clean rebuilds before
      # this was found.
      #
      # Webpack's cache is the part actually worth keeping — it is what makes
      # repeat builds fast, and it carries no content.
      - .next/cache/webpack/**/*
