name: CI

# Useful with zero tests: compiles every file and imports every module, which
# catches a syntax error or a broken import before it reaches production.
# Gets stronger as tests appear — it runs them automatically once they exist.
on:
  push: { branches: [main, master] }
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # ⚠️ 24, not 20. Node 20 cannot load a TypeScript file at all -- it throws
        # ERR_UNKNOWN_FILE_EXTENSION on a .ts/.mts test file OR on a .ts module a
        # test imports -- and --experimental-strip-types does not exist before
        # 22.18. A repo pinned here below the version it is written for gets a
        # workflow that can NEVER pass, which carries exactly as little
        # information as one that can never fail. trading-hub sat red for
        # thirteen days on this; civitas, telehealth-platform and
        # haslett-website had been red since the day CI was added to them.
        # Pinning the runner above the version the project needs is free.
        with: { node-version: '24' }

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # NOT `[ -f tsconfig.json ] && npx tsc --noEmit || echo "no tsconfig"`.
      # A command in a `&&` list is exempt from errexit unless it is the last
      # one, so a FAILING tsc was caught by the `||`, the list succeeded, and the
      # step went green having printed the errors nobody reads. The fleet harness
      # names this exact shape as rule 5's favourite disguise; it was here too.
      - name: Type-check if TypeScript
        run: |
          if [ -f tsconfig.json ]; then npx tsc --noEmit; else echo "no tsconfig"; fi

      - name: Images are servable
        run: node scripts/check-images.mjs

      # The published contact address and phone live in src/lib/business.ts and nowhere
      # else. Swapping that address was logged as "a three-line change" and was ELEVEN
      # across NINE files; nothing connected them, so the only way to get it right was to
      # already suspect the note was wrong. This step is why the next swap is one line.
      # It forbids the CORRECT address as a literal too -- a guard that only banned the old
      # value would go green the moment somebody pasted the new one. --self-test runs it
      # against deliberately broken input, because a check never observed failing is a
      # rumour.
      - name: Contact details come from one source
        run: |
          node scripts/check-contact.mjs --self-test
          node scripts/check-contact.mjs

      - name: Build if the project builds
        run: npm run build --if-present

      # After the build, because it reads the rendered HTML rather than the
      # source — metadata can be present in the source and overridden at render.
      - name: Every page ships a social card
        run: node scripts/check-og.mjs

      # Also after the build, and for the same reason as the card check above: a
      # source grep for `jsonLd(` passes on a call whose output is then discarded
      # or re-wrapped. The <script> a browser receives is the artifact. It has a
      # --self-test, because a check never observed failing is a rumour.
      - name: JSON-LD survives the script tag
        run: node scripts/check-jsonld.mjs

      - name: Test if tests exist
        run: npm test --if-present

      # The CDK app is a separate npm project, so the root install and typecheck
      # never saw it — the Lambda handlers that serve the live blog were outside
      # CI entirely. machine-auth.test.ts covers POST /machine/blogs, where the
      # failure would be attributing a machine's post to a person.
      # ⚠️ TWO installs, because there are two package.json files and
      # infrastructure/tsconfig.json includes `lambda/**/*`. Installing only
      # infrastructure/ left every lambda import unresolvable, so this step
      # failed with "Cannot find module '@aws-sdk/client-dynamodb'" and a train
      # of implicit-any errors downstream of it. It passed locally the whole
      # time because lambda/node_modules was already on the developer's disk.
      #
      # It had been failing since 2026-10-16, which is the expensive part: CI was
      # permanently red, so when check-og.mjs correctly caught /payments shipping
      # with no social card on 2026-10-24, the new true failure was
      # indistinguishable from the standing one and the page went live bare.
      # A red build nobody can act on is a build that checks nothing.
      - name: Infrastructure — typecheck and the Lambda tests
        working-directory: infrastructure
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          (cd lambda && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund))
          npx tsc --noEmit
          npm test
