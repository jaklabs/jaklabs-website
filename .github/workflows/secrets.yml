name: Secrets

# TruffleHog over the commits this push or PR adds. Fails on VERIFIED (live)
# credentials only; dead keys and placeholders don't turn the build red.
# Run by hand (Actions -> Secrets -> Run workflow) to scan the whole history.
# Installed by ~/claude-server/scripts/add-ci.sh.
on:
  push: { branches: [main, master] }
  pull_request:
  workflow_dispatch:

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: No live credentials in these commits
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          version: 3.99.8
          extra_args: --results=verified
